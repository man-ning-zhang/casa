<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="#000">
    <!-- tail (V-fan at lower-left, behind the body) -->
    <polygon points="3,47 20,39 17,51 8,53"/>
    <!-- body (ellipse, tilted up-right) -->
    <ellipse cx="27" cy="38" rx="16" ry="7.5" transform="rotate(-22 27 38)"/>
    <!-- head -->
    <circle cx="43" cy="26" r="7"/>
    <!-- beak (small triangle pointing right) -->
    <polygon points="49,25 57,26 49,29"/>
    <!-- raised wing (swept curve up to a tip) -->
    <path d="M24 32 C 28 18, 38 10, 50 8 C 46 14, 38 22, 30 30 Z"/>
    <!-- olive leaf at the beak -->
    <ellipse cx="55" cy="22" rx="2.6" ry="1.4" transform="rotate(-30 55 22)"/>
  </g>
</svg>